# Cargo configuration for cross-platform builds

# Linux 32-bit target configuration
[target.i686-unknown-linux-gnu]
linker = "i686-linux-gnu-gcc"
rustflags = ["-C", "link-arg=-march=i686"]

# Linux 64-bit target configuration
[target.x86_64-unknown-linux-gnu]
rustflags = []

# Windows 32-bit target configuration
[target.i686-pc-windows-msvc]
rustflags = ["-C", "link-arg=/SUBSYSTEM:CONSOLE"]

# Windows 64-bit target configuration
[target.x86_64-pc-windows-msvc]
rustflags = []
