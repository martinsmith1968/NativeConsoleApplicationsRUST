name: CI Build
run-name: CIBuild_${{ github.event_name }}_${{ github.ref_name }}_${{ github.run_number }}.${{ github.run_attempt }}

on:
  push:
    branches:
      - main
      - master
      - rc/**
      - feature/**
      - task/**
      - spike/**

  pull_request:
    branches:
      - master
      - main

  workflow_dispatch:

# The jobs live in the reusable _*.yml workflows. Called workflows do not inherit
# env, so the pipeline settings are passed to them as inputs here.
jobs:
  setup:
    name: Setup
    uses: ./.github/workflows/_setup.yml
    with:
      major_version: '1'
      minor_version: '8'
      primary_branch: main
      release_candidate_prefix: rc/

  build:
    name: Build
    needs: setup
    uses: ./.github/workflows/_build.yml
    with:
      project_name: NativeConsoleApplicationsRUST
      executable_version: ${{ needs.setup.outputs.executable_version }}
      executable_build_version: ${{ needs.setup.outputs.executable_build_version }}
      binary_names: ${{ needs.setup.outputs.binary_names }}

  coverage:
    name: Coverage
    needs: setup
    uses: ./.github/workflows/_coverage.yml

  audit:
    name: Audit
    needs: setup
    uses: ./.github/workflows/_audit.yml

  release:
    name: Release
    needs:
      - setup
      - build
      - coverage
      - audit
    uses: ./.github/workflows/_release.yml
    # The only jobs that write to the repository (tags and releases)
    permissions:
      contents: write
      pull-requests: read
    with:
      executable_version: ${{ needs.setup.outputs.executable_version }}
      should_tag: ${{ needs.setup.outputs.should_tag }}
      should_release: ${{ needs.setup.outputs.should_release }}
      release_is_draft: ${{ needs.setup.outputs.release_is_draft }}
      release_is_prerelease: ${{ needs.setup.outputs.release_is_prerelease }}
