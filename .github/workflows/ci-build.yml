name: CI Build
run-name: CIBuild_${{ github.event_name }}_${{ github.ref_name }}_${{ github.run_number }}.${{ github.run_attempt }}

env:
  PROJECT_NAME: NativeWindowsConsoleApplicationsRUST
  PRIMARY_BRANCH_NAME: main
  APP_MAJOR_VERSION: 2
  APP_MINOR_VERSION: 1
  BRANCH_PREFIX_RELEASE_CANDIDATE: rc/

on:
  push:
    branches:
      - main
      - master
      - rc/**
      - feature/**
      - task/**
      - spike/**

  pull_request:
    branches:
      - master
      - main

  workflow_dispatch:

# The jobs live in the reusable _*.yml workflows. Called workflows do not inherit
# env, so the pipeline settings are passed to them as inputs here.
# Diagnostic steps (file listings, environment, toolchain details) only run with
# debug logging on: re-run with "Enable debug logging", or set ACTIONS_STEP_DEBUG.
jobs:
  # The env context is not available in the "with" of a reusable workflow call, but job
  # outputs can read it, and "needs" is available there. So the settings above are
  # published as outputs of this job and consumed from needs.config.outputs below.
  config:
    name: Config
    runs-on: ubuntu-latest
    outputs:
      project_name: ${{ env.PROJECT_NAME }}
      primary_branch: ${{ env.PRIMARY_BRANCH_NAME }}
      major_version: ${{ env.APP_MAJOR_VERSION }}
      minor_version: ${{ env.APP_MINOR_VERSION }}
      release_candidate_prefix: ${{ env.BRANCH_PREFIX_RELEASE_CANDIDATE }}
    steps:
      - run: echo "Pipeline settings published as outputs"

  setup:
    name: Setup
    needs: config
    uses: ./.github/workflows/_setup.yml
    with:
      major_version: '${{ needs.config.outputs.major_version }}'
      minor_version: '${{ needs.config.outputs.minor_version }}'
      primary_branch: '${{ needs.config.outputs.primary_branch }}'
      release_candidate_prefix: '${{ needs.config.outputs.release_candidate_prefix }}'

  build:
    name: Build
    needs:
      - config
      - setup
    uses: ./.github/workflows/_build.yml
    with:
      project_name: ${{ needs.config.outputs.project_name }}
      executable_version: ${{ needs.setup.outputs.executable_version }}
      executable_build_version: ${{ needs.setup.outputs.executable_build_version }}
      binary_names: ${{ needs.setup.outputs.binary_names }}

  coverage:
    name: Coverage
    needs: setup
    uses: ./.github/workflows/_coverage.yml

  audit:
    name: Audit
    needs: setup
    uses: ./.github/workflows/_audit.yml

  release:
    name: Release
    needs:
      - setup
      - build
      - coverage
      - audit
    uses: ./.github/workflows/_release.yml
    # The only jobs that write to the repository (tags and releases)
    permissions:
      contents: write
      pull-requests: read
    with:
      executable_version: ${{ needs.setup.outputs.executable_version }}
      should_tag: ${{ needs.setup.outputs.should_tag }}
      should_release: ${{ needs.setup.outputs.should_release }}
      release_is_draft: ${{ needs.setup.outputs.release_is_draft }}
      release_is_prerelease: ${{ needs.setup.outputs.release_is_prerelease }}
